# SPDX-License-Identifier: AGPL-3.0-only
# Builds Meadhall for Windows (NSIS .exe), Linux (AppImage, Fedora .rpm, Debian/Ubuntu .deb) and Android (.apk).
#
# Push a tag like v0.2.0 to publish: a draft GitHub Release is created, every build uploads to it, and it is
# published only when all of them succeed (so the desktop auto-updater never sees a half-uploaded release).
# Run it manually (workflow_dispatch) to build without publishing; the files are kept as workflow artifacts.
#
# Optional secrets for a release-signed Android APK (without them the APK is debug-signed):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]
    # Build-only check of packaging changes on work branches (nothing is published without a tag).
    branches: ["fork/**"]
    paths:
      - .github/workflows/release.yml
      - apps/desktop/**
      - apps/mobile/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::Release tags must look like v0.2.0 (got $tag)"
              exit 1
            fi
            version="${tag#v}"
          else
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          IFS=. read -r major minor patch <<< "${version%%-*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Android versionCode: 1.2.3 -> 10203 (must only ever increase and be positive; dev builds use the run number).
          code=$((major * 10000 + minor * 100 + patch))
          echo "code=$(( code > 0 ? code : GITHUB_RUN_NUMBER ))" >> "$GITHUB_OUTPUT"

  draft:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, for the compare link
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # The release notes are the tag's section of CHANGELOG.md (from "## vX.Y.Z" to the next "## "), followed by
        # the compare link. A tag without a changelog section stops here, before anything is built.
        run: |
          awk -v tag="$TAG" '
            $0 ~ "^## " && found { exit }
            index($0, "## " tag " ") == 1 || $0 == "## " tag { found = 1; next }
            found { print }
          ' CHANGELOG.md | perl -0pe 's/\n  (?=\S)/ /g' > notes.md
          # (perl rejoins wrapped lines: release pages show every newline as a line break)
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $TAG. Add one (## $TAG (date)) before tagging."
            exit 1
          fi
          previous=$(git tag --sort=-v:refname --merged "$TAG" | grep -v "^$TAG$" | head -1)
          if [[ -n "$previous" ]]; then
            printf '\n**Full changelog:** https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$previous" "$TAG" >> notes.md
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --notes-file notes.md --title "Meadhall $TAG" \
              $([[ "$TAG" == *-* ]] && echo --prerelease)

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: [version, draft]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            args: --win nsis
            files: |
              apps/desktop/dist-electron/*.exe
              apps/desktop/dist-electron/*.blockmap
              apps/desktop/dist-electron/latest.yml
          - name: Linux
            os: ubuntu-24.04
            args: --linux AppImage rpm deb
            files: |
              apps/desktop/dist-electron/*.AppImage
              apps/desktop/dist-electron/*.rpm
              apps/desktop/dist-electron/*.deb
              apps/desktop/dist-electron/latest-linux.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes rpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop run build
      # electron-builder is called directly: scripts/dist-with-version.mjs (for interactive local builds) can't
      # spawn pnpm on Windows runners.
      - name: Build installers
        shell: bash
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
          # Unsigned builds: no code signing certificate is configured.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        # Never publish from electron-builder: it looks for the draft through the releases list, and when that
        # list came back incomplete (v0.2.0) it created extra drafts and the published release had no desktop files.
        # The upload step below targets the tag's draft the same way the Android job does.
        run: >-
          pnpm exec electron-builder --config electron-builder.json
          --config.extraMetadata.version=${{ needs.version.outputs.version }}
          ${{ matrix.args }} --publish never
      - name: Upload to the draft release
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ matrix.files }}
        run: |
          # FILES holds glob patterns, one per line; unquoted expansion lets bash expand them.
          # shellcheck disable=SC2086
          gh release upload "${{ github.ref_name }}" $FILES --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meadhall-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    needs: [version, draft]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm --dir apps/mobile run build
        env:
          # The app compares this with the latest release to tell people an update is out.
          VITE_MEADHALL_VERSION: ${{ needs.version.outputs.version }}
      - name: Prepare release signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/meadhall.jks"
            echo "keystore=$RUNNER_TEMP/meadhall.jks" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is debug-signed and can't update builds signed with another key."
            echo "suffix=-debug-signed" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK
        working-directory: apps/mobile/android
        env:
          MEADHALL_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          MEADHALL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEADHALL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEADHALL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon assembleRelease
          -PappVersionName=${{ needs.version.outputs.version }}
          -PappVersionCode=${{ needs.version.outputs.code }}
      - name: Name the APK
        shell: bash
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "dist/Meadhall-${{ needs.version.outputs.version }}-android${{ steps.signing.outputs.suffix }}.apk"
      - if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meadhall-Android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Build provenance (Sigstore): signed statements that each file was built by this workflow from this repo.
      id-token: write
      attestations: write
    steps:
      - name: Download and check the release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.exe" --pattern "*.AppImage" --pattern "*.rpm" --pattern "*.deb" --pattern "*.apk"
          # Refuse to publish an incomplete release (the desktop auto-updater needs latest*.yml too).
          names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for pattern in '\.exe$' '\.exe\.blockmap$' '^latest\.yml$' '\.AppImage$' '\.rpm$' '\.deb$' '^latest-linux\.yml$' '\.apk$'; do
            grep -qE "$pattern" <<< "$names" || { echo "::error::Release $TAG is missing a file matching $pattern"; exit 1; }
          done
          sha256sum * > SHA256SUMS.txt
      # Verify a download with: gh attestation verify <file> --repo PeytonG/Meadhall
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/*.exe
            assets/*.AppImage
            assets/*.rpm
            assets/*.deb
            assets/*.apk
            assets/SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
