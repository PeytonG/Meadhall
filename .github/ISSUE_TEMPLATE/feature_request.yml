name: Feature request
description: Suggest an idea for Meadhall
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or wish, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Meadhall help?
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Mockups, pixel art, examples from Discord or Element...